

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Hebdomadaire</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
<h1>Budget Hebdomadaire</h1>

<div class="card">
<label><div class="box hebdo">Budget hebdomadaire (€)</label>
<input id="budget" type="number" style="height:100%; width:10%; background:#fff3cd;color:red;font-size:18px;"value="160">
<div class="box budget">
<script type="text/javascript">

var maintenant = new Date();
var annee = maintenant.getYear();
if(annee < 999) annee+=1900;
document.write("<h3>Année : " + annee );


//function NrSemaine(madate) {
//var prem = new Date(madate.getUTCFullYear(),0,1);
//var sem = Math.ceil((((madate - prem) / 86400000) + (madate.getUTCDay()))/7);
//return sem
//}
 
//var now = new Date()
 

           
          //  document.write ("<font color='red'> - Semaine : "+ NrSemaine(now) + "</font></h3>")
         </script></div></div>

 
</div>

<div class="stats card">
<div><div class="box budget">Budget: <span id="budgetVal"></span></div></div>
<div><div class="box depense">Dépensé: <span id="spentVal"></span></div></div>
<div><div class="box reste">Reste: <span id="remainVal"></span></div></div>
<div><div class="box conseil">Conseillé/jour: <span id="dayVal"></span></div></div>
</div>

<div class="card">
<h3>Ajouter une dépense</h3>
<input id="date" type="date">
<select id="cat">
<option>Courses</option><option>Transport</option><option>Loisirs</option>
<option>Santé</option><option>Factures</option><option>Carburant</option>
<option>Bricolage</option><option>Coiffeur</option><option>Super-U</option>
<option>Lidl</option><option>Leclerc</option><option>Autre</option>
</select>
<input id="label" placeholder="Libellé">
<input id="amount" type="number" step="0.01" placeholder="Montant">
<button onclick="addExpense()">Ajouter</button>
<button onclick="exportCSV()">Exporter CSV</button>
<button onclick="exportJSON()">
    Export JSON
</button>

<input
    type="file"
    id="importFile"
    accept=".json"
    onchange="importJSON(event)"
>
</div>

<div class="card">
<h3>Dépenses</h3>
<table><thead><tr><th>Date</th><th>Catégorie</th><th>Libellé</th><th>Montant</th><th></th></tr></thead>
<tbody id="rows"></tbody></table>
</div>

<div class="card">
<h3>Historique semaine</h3>
<select id="weekSelect" onchange="render()"></select>
</div>

<div class="card"><canvas id="chart"></canvas></div>
</div>
<script src="app.js"></script>
</body>
</html>
